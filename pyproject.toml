[project]
name = "phef"
version = "0.1.0"
description = "PHEF: predictive hysteresis memory - capacity scans and escape dynamics"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["phef"]
include = ["phef*"]
